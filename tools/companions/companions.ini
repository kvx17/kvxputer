; Isolated companion firmware (not kvxputer Cardputer image).
; pio run -e companion-csi-beacon
; pio run -e companion-findmy
; pio run -e companion-chatmesh-relay
; pio run -e companion-c5-unified

[companion_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = off
lib_deps =
extra_scripts =
	post:tools/build/copy_companions.py
build_unflags =
	-Werror=odr

[env:companion-csi-beacon]
extends = companion_base
board = esp32-s3-devkitc-1
build_src_filter =
	-<*>
	+<../tools/companions/csi_beacon/>

[env:companion-findmy]
extends = companion_base
board = esp32-s3-devkitc-1
build_src_filter =
	-<*>
	+<../tools/companions/findmy/>

[env:companion-chatmesh-relay]
extends = companion_base
board = esp32-s3-devkitc-1
build_src_filter =
	-<*>
	+<../tools/companions/chatmesh_relay/>

[env:companion-c5-unified]
extends = companion_base
board = esp32-c5-devkitc-1
lib_deps =
	adafruit/Adafruit NeoPixel
build_src_filter =
	-<*>
	+<../tools/companions/c5_unified/>
