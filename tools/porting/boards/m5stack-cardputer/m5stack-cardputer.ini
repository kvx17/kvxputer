; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cardputer]
board = m5stack-cardputer
board_build.partitions = tools/build/partitions/custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../tools/porting/boards/m5stack-cardputer>
build_flags =
	${env.build_flags}
	-Itools/porting/boards/m5stack-cardputer
	-DCORE_DEBUG_LEVEL=0

	; NimBLE: 8 bonds (HID uses 6 slots; leave headroom for other BLE tools). CCCDs=24 for kbd+media+mouse
	-DCONFIG_BT_NIMBLE_MAX_BONDS=8
	-DCONFIG_BT_NIMBLE_MAX_CCCDS=24

	-D ANALOG_BAT_PIN=10

	-DTCA8418_INT_PIN=11
	-DTCA8418_I2C_ADDR=0x34
	-DTCA8418_SDA_PIN=8
	-DTCA8418_SCL_PIN=9

	;Features Enabled
	;-DLITE_VERSION=1 ;limits some features to save space for M5Launcher Compatibility
	; ES8311 Codec (ADV)
	-D ES8311_CODEC=1
	-D ES8311_ADDR=0x18

	;Microphone
	-DMIC_SPM1423=1 ;uncomment to enable Applicable for SPM1423 device
	-DPIN_CLK=43
	-DI2S_SCLK_PIN=43
	-DI2S_DATA_PIN=46
	-DPIN_DATA=46

	;FM Radio
	-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713
	-DFM_RSTPIN=40

	;RGB LED runned by xylopyrographer/LiteLED@^1.2.0 library
	-DHAS_RGB_LED=1
	-DRGB_LED=21

	;Speaker to run music, compatible with NS4168
	-DHAS_NS4168_SPKR=1 ;uncomment to enable
	-DBCLK=41
	-DWCLK=43
	-DDOUT=42
	-DMCLK=43 # Microphone CLK or WCLK

	;Can run USB as HID
	-DUSB_as_HID=1

	; Optional M5 Unit Scroll on Grove PORT.A (I2C 0x40, SDA=G2 SCL=G1)
	-DHAS_ENCODER=1
	-DUNIT_SCROLL=1
	-DUNIT_SCROLL_ADDR=0x40
	-DUNIT_SCROLL_DETENTS_PER_STEP=1
	-DUNIT_SCROLL_HOLD_MS=450

	; Optional M5 Unit Joystick2 on Grove PORT.A (I2C 0x63) — HID mouse
	-DUNIT_JOYSTICK2=1
	-DUNIT_JOYSTICK2_ADDR=0x63

	; Evil-Cardputer extension modules (NetOps / BLE extras / WiFi extras)
	-DEVIL_EXTENSIONS=1
	; Optional LLM Grove UART hardware:
	;-DHAS_LLM_MODULE=1
	; If app flash overflows later, gate heavy addons instead of dropping EVIL_EXTENSIONS:
	;-DHAS_TAGTINKER=0 -DHAS_CSI_RADAR=0 -DHAS_C5_SERIAL=0

	;Buttons configuration
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW

	;Font sizes, depending on device
	-DFP=1
	-DFM=2
	-DFG=3

	;-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;Infrared Led default pin and state
	-DIR_TX_PINS='{ {"Default", TXLED}, {"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15} }'
	-DIR_RX_PINS='{ {"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'
	-DTXLED=44
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'
	-DRF_RX_PINS='{ {"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'
	; connection pins using microSD sniffer module https://www.sparkfun.com/products/9419 https://docs.m5stack.com/en/core/Cardputer
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=GROVE_SDA
	-DCC1101_SS_PIN=SPI_SS_PIN
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	;-DCC1101_GDO2_PIN=-1

	; connections are the same as CC1101
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=GROVE_SDA
	-DNRF24_SS_PIN=SPI_SS_PIN
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=SPI_SS_PIN
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=GROVE_SDA

	; Cap LoRa868 (SX1262) — bundled with Cardputer-Adv
	-DHAS_LORA_CAP=1
	;Lora setup pins
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=5
	-DLORA_RST=3
	-DLORA_DIO0=4
	-DLORA_IRQ=4
	-DLORA_BUSY=6

	;Screen Setup
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=38
	-DMINBRIGHT=160

	;TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_2_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	;SD Card Setup pins
	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

	;Default I2C port
	-DGROVE_SDA=2
	-DGROVE_SCL=1
	-D SYS_I2C_SDA=-1 #8 on ADV Only
	-D SYS_I2C_SCL=-1 #9 on ADV Only

	;Default SPI port
	-DSPI_SCK_PIN=40
	-DSPI_MOSI_PIN=14
	-DSPI_MISO_PIN=39
	-DSPI_SS_PIN=GROVE_SCL

	; PN532 SPI defaults (shared SPI bus; CS on GROVE_SCL / GPIO1)
	-DPN532_SCK_PIN=40
	-DPN532_MISO_PIN=39
	-DPN532_MOSI_PIN=14
	-DPN532_SS_PIN=1
	-DPN532_CE_PIN=-1

	-DDEVICE_NAME='"kvxputer"'

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.2
	https://github.com/m5stack/M5Unit-Scroll.git
	https://github.com/m5stack/M5Unit-Joystick2.git

; Flash-constrained profile: Bruce LITE + no Evil extension stubs
[env:m5stack-cardputer-lite]
extends = env:m5stack-cardputer
build_unflags =
	-DEVIL_EXTENSIONS=1
build_flags =
	${env:m5stack-cardputer.build_flags}
	-DLITE_VERSION=1
