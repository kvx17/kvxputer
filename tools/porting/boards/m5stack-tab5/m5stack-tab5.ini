; PlatformIO Project Configuration File — M5Stack Tab5 (ESP32-P4 + C6 hosted)
; Same branch as Cardputer; feature limits via flags (no build_src_filter menu strip).

[env:m5stack-tab5]
board = m5stack-tab5
board_build.psram = enabled
board_build.flash_mode = qio
board_build.flash_size = 16MB
; ESP32-P4 Arduino libs use HEX PSRAM (qio_qspi @ 200MHz). Do NOT set
; board_build.psram_type=opi — that is an S3 OPI path and breaks Tab5 MIPI-DSI.
board_build.f_psram = 200000000L
board_build.partitions = tools/build/partitions/custom_16Mb_tab5.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 1500000
; Exclude BLE attack suite (NimBLE cannot build on P4); keep ble_menu + USB HID remote.
build_src_filter =
	${env.build_src_filter}
	+<../tools/porting/boards/m5stack-tab5>
	-<menu/ble/>
	+<menu/ble/ble_menu.cpp>
	+<menu/ble/hid_remote/>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-Itools/porting/boards/m5stack-tab5
	-Itools/porting/boards/m5stack-tab5/nimble_stubs
	-DCORE_DEBUG_LEVEL=1
	; Force M5GFX Tab5 path (Bus_DSI + Panel_ST7121/ST7123/ILI9881C autodetection).
	; board_M5Tab5 == 22 in lgfx/boards.hpp
	-DM5GFX_BOARD=22

	; USB gadget HID (kvxkeyboard / BadUSB) over Type-C OTG — BLE stack still gated
	-DUSB_as_HID=1

	; Milestone 1: no Evil addons; NimBLE 2.5 does not build on ESP32-P4
	;-DEVIL_EXTENSIONS=1
	-DKVX_NO_NIMBLE=1
	;-DKVX_NO_WIFI_ATTACK=1

	; FM Radio (Grove I2C probe)
	-DFM_SI4713=1
	-DFM_RSTPIN=-1

	; Font sizes: set in pins_arduino.h (do not -DFP= here — clashes with M5Utility/FastLED)

	; Infrared / RF via Grove PORT.A (no onboard IR LED)
	-DIR_TX_PINS='{ {"Grove Y", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"M5 IR Mod", GROVE_SDA} }'
	-DIR_RX_PINS='{ {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"M5 IR Mod", GROVE_SCL} }'
	-DTXLED=GROVE_SDA
	-DRXLED=GROVE_SCL
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DRF_TX_PINS='{ {"M5 RF433T", GROVE_SDA}, {"Grove Y", GROVE_SDA}, {"Grove W", GROVE_SCL} }'
	-DRF_RX_PINS='{ {"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA} }'

	; M5-Bus SPI for CC1101/NRF24 — CS/GDO0/CE default -1 until Pins menu
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=-1
	-DCC1101_SS_PIN=-1
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=-1
	-DNRF24_SS_PIN=-1
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=-1

	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=-1
	-DLORA_RST=-1
	-DLORA_DIO0=-1

	-DHAS_SCREEN=1
	-DHAS_TOUCH=1
	; Native panel is 720×1280 (M5GFX Panel_DSI). Odd rotation = landscape.
	; 3 = keyboard along the bottom (horizontally flipped vs rotation 1).
	-DROTATION=3

	; Using M5GFX driver (ST7123 / ST7121 / ILI9881C via M5Unified)
	; Portrait-native dims — same convention as Cardputer (gsetRotation swaps for landscape).
	-DUSE_M5GFX=1
	-DTFT_WIDTH=720
	-DTFT_HEIGHT=1280

	; microSD SPI mode (not SDIO — C6 uses SDIO host)
	-DSDCARD_CS=42
	-DSDCARD_SCK=43
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=44

	; Grove PORT.A (HY2.0-4P)
	-DGROVE_SDA=53
	-DGROVE_SCL=54
	; Sys I2C: touch / BMI270 / RTC / INA226 / PI4IO (M5.In_I2C)
	-DSYS_I2C_SDA=31
	-DSYS_I2C_SCL=32

	-DGPS_SERIAL_TX=53
	-DGPS_SERIAL_RX=54
	-DSERIAL_TX=37
	-DSERIAL_RX=38

	; M5-Bus SPI bus for external modules
	-DSPI_SCK_PIN=5
	-DSPI_MOSI_PIN=18
	-DSPI_MISO_PIN=19
	-DSPI_SS_PIN=-1

	-DDEVICE_NAME='"M5Tab5"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified@^0.2.23
	m5stack/M5GFX@^0.2.30
	m5stack/M5UnitUnified@>=0.4.6
	https://github.com/m5stack/M5Unit-KEYBOARD.git#0.1.0

lib_ignore =
	TFT_eSPI
	NimBLE-Arduino
	ESP Amiibolink
	ESP Chameleon Ultra
	ESP PN32BLE
	ESP PN532Killer
	FastLED
