# Unit Scroll settings - edit with `scrollctl`
[scroll]
# auto = scan every I2C bus, or a bus number
bus = auto
# auto | inject (send keys into the built-in keyboard, works in APPLaunch) | uinput
output = auto
target = /dev/input/by-path/platform-3f804000.i2c-event
# custom = cw/ccw keys below | keys = arrow keys | wheel = mouse wheel (uinput only)
mode = custom
# clockwise / counter-clockwise: Right/Left moves the menu, Shift+PgDn/PgUp scrolls the CLI
cw = right shift+pagedown
ccw = left shift+pageup
# while the launcher's CLI is open (a shell runs under the launcher), use these instead
screen_detect = yes
launcher = APPLaunch
cli_cw = shift+pagedown
cli_ccw = shift+pageup
# used by keys/wheel modes: normal | inverted | horizontal | horizontal-inverted
orientation = normal
press = enter
hold = esc
hold_ms = 600
# LED colour while connected (r,g,b), 0,0,0 = off
led = 0,0,40
# Cardputer Zero: switch the Grove port to I2C and turn its 5V on at start
grove_setup = yes
